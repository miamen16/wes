name: Fix ACF duplicate keys

on:
  push:
    branches:
      - fix/acf-duplicate-keys

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix duplicate ACF field keys
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('inc/acf-blocks.php')
          text = path.read_text(encoding='utf-8')

          old = "'key'           => 'field_sh_lead'"
          assert text.count(old) == 1
          text = text.replace(old, "'key'           => 'field_sh_lead_wysiwyg'", 1)

          old = "'key' => 'field_ic_color'"
          assert text.count(old) == 2
          first = text.find(old)
          second = text.find(old, first + 1)
          text = text[:second] + text[second:].replace(old, "'key' => 'field_ic_color_picker'", 1)

          marker = "'key'      => 'group_block_audience_guide_cpt'"
          start = text.find(marker)
          assert start != -1
          next_group = text.find("\n\tacf_add_local_field_group( array(", start + len(marker))
          assert next_group != -1
          segment = text[start:next_group]
          assert re.search(r"'key'\s*=>\s*'field_ag_", segment)
          segment = re.sub(r"('key'\s*=>\s*')field_ag_([^']+)(')", r"\1field_ag_cpt_\2\3", segment)
          text = text[:start] + segment + text[next_group:]

          keys = re.findall(r"['\"]key['\"]\s*=>\s*['\"]([^'\"]+)['\"]", text)
          duplicates = sorted({k for k in keys if keys.count(k) > 1})
          assert not duplicates, f'Duplicate ACF keys remain: {duplicates}'
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate PHP syntax
        run: php -l inc/acf-blocks.php

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inc/acf-blocks.php
          git rm .github/workflows/fix-acf-duplicate-keys.yml
          git commit -m "Fix duplicate ACF field keys"
          git push origin HEAD:fix/acf-duplicate-keys
